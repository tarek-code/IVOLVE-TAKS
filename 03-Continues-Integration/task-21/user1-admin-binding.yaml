# ClusterRoleBinding: Binds the built-in 'admin' ClusterRole to user1 cluster-wide.
# user1 gets full read-write and role/rolebinding management in ALL namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: user1-admin-binding
subjects:
  - kind: User
    name: user1
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: admin
  apiGroup: rbac.authorization.k8s.io
